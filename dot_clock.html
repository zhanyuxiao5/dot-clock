<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dot Clock</title>
    <style>
        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: #fff;
            color: #242424;
            font: 15px Arial, sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center
        }

        main {
            width: 92%;
            max-width: 480px;
            min-width: 0;
            padding: 24px 0
        }

        .time {
            font-size: 32px;
            font-weight: 500;
            text-align: center;
            letter-spacing: .08em;
            font-variant-numeric: tabular-nums;
            margin-bottom: 18px
        }

        svg {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 1 / 1
        }

        .controls {
            display: grid;
            gap: 16px;
            padding: 24px 8px 0
        }

        .control {
            display: grid;
            grid-template-columns: 86px minmax(0, 1fr) 30px;
            align-items: center;
            gap: 12px
        }

        input {
            width: 100%;
            accent-color: #242424
        }

        output {
            text-align: right;
            font-variant-numeric: tabular-nums
        }

        button {
            font: inherit;
            background: #242424;
            color: white;
            border: 0;
            padding: 12px;
            cursor: pointer;
            border-radius: 3px
        }

        button:hover {
            background: #444
        }

        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px
        }

        .control:nth-child(1) {
            --ring-color: #C94A36
        }

        .control:nth-child(2) {
            --ring-color: #284C96
        }

        .control:nth-child(3) {
            --ring-color: #D9AA29
        }

        .control label {
            display: flex;
            align-items: center;
            gap: 7px
        }

        .control label::before {
            content: "";
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--ring-color);
            flex-shrink: 0
        }

        .control input {
            accent-color: var(--ring-color)
        }

        @media(max-width:480px) {
            main {
                padding: 16px 0
            }

            .time {
                font-size: 28px;
                margin-bottom: 12px
            }

            .controls {
                padding-top: 16px;
                gap: 12px
            }

            input {
                min-width: 0
            }

            button {
                font-size: 14px
            }
        }
    </style>
</head>

        <div class="controls">
            <div class="control"><label for="hours">Hours</label><input id="hours" type="range" min="0" max="23"
                    value="10"><output id="hoursValue" for="hours">10</output></div>
            <div class="control"><label for="minutes">Minutes</label><input id="minutes" type="range" min="0" max="59"
                    value="36"><output id="minutesValue" for="minutes">36</output></div>
            <div class="control"><label for="seconds">Seconds</label><input id="seconds" type="range" min="0" max="59"
                    value="52"><output id="secondsValue" for="seconds">52</output></div>

                    type="button">Sync to Local Time</button></div>

    <script>
        const svg = document.getElementById('clock');
        const controls = ['hours', 'minutes', 'seconds'].map(id => document.getElementById(id));
        const ns = 'http://www.w3.org/2000/svg';
        const pad = n => String(n).padStart(2, '0');
        function element(tag, attrs) { const e = document.createElementNS(ns, tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); svg.appendChild(e); }
        function mix(c, b) { return '#' + [1, 3, 5].map(i => Math.round(parseInt(c.slice(i, i + 2), 16) * .08 + parseInt(b.slice(i, i + 2), 16) * .92).toString(16).padStart(2, '0')).join(''); }
        function pos(i, n, r) { return [210 + Math.sin(i * 2 * Math.PI / n) * r, 210 - Math.cos(i * 2 * Math.PI / n) * r]; }
        function arc(n, r, k) { return `M${pos(0, n, r).join(' ')} A${r} ${r} 0 ${(k - 1) / n > .5 ? 1 : 0} 1 ${pos(k - 1, n, r).join(' ')}`; }
        function draw() {
            const [h, m, s] = controls.map(e => Number(e.value));
            document.getElementById('time').textContent = [h, m, s].map(pad).join(':');
            const bg = h >= 12 ? '#242424' : '#F7F6F2';
            const c = h >= 12 ? ['#E66A50', '#7799DD', '#EFC34C'] : ['#C94A36', '#284C96', '#D9AA29'];
            controls.forEach((e, i) => e.closest(".control").style.setProperty("--ring-color", c[i]));
            while (svg.firstChild) svg.removeChild(svg.firstChild);
            svg.setAttribute('aria-label', `Time: ${pad(h)}:${pad(m)}:${pad(s)}`);
            element('rect', { width: 420, height: 420, fill: bg });
            const rings = [
                { n: 12, r: 174, k: h % 12, c: c[0], d: 14, hour: true, link: true },
                { n: 5, r: 128, k: Math.floor(m / 10), c: c[1], d: 11, link: true },
                { n: 9, r: 96, k: m % 10, c: c[1], d: 5.5 },
                { n: 5, r: 65, k: Math.floor(s / 10), c: c[2], d: 9, link: true },
                { n: 9, r: 35, k: s % 10, c: c[2], d: 4.5 }];
            for (const g of rings) {
                const pale = mix(g.c, bg);
                if (g.link) element('circle', { cx: 210, cy: 210, r: g.r, fill: 'none', stroke: pale, 'stroke-width': 6 });
                for (let i = 0; i < g.n; i++) { const [cx, cy] = pos(i, g.n, g.r); element('circle', { cx, cy, r: g.d, fill: pale }); }
                if (g.link && (g.hour ? g.k > 0 : g.k >= 2)) element('path', { d: arc(g.n, g.r, g.hour ? g.k + 1 : g.k), fill: 'none', stroke: g.c, 'stroke-width': 6, 'stroke-linecap': 'round' });
                for (let i = 0; i < g.n; i++)if (g.hour ? i === g.k : i < g.k) { const [cx, cy] = pos(i, g.n, g.r); element('circle', { cx, cy, r: g.d, fill: g.c }); }
            }
            controls.forEach(e => document.getElementById(e.id + 'Value').textContent = pad(e.value));
        }
        const toggle = document.getElementById('toggle');
        let timer = null, base = 0, started = 0;
        function readTime() { return controls.reduce((v, e) => v * 60 + Number(e.value), 0); }
        function tick() { const t = (base + Math.floor((performance.now() - started) / 1000)) % 86400; controls[0].value = Math.floor(t / 3600); controls[1].value = Math.floor(t / 60) % 60; controls[2].value = t % 60; draw(); }
        toggle.addEventListener('click', () => { if (timer !== null) { tick(); clearInterval(timer); timer = null; toggle.textContent = 'Start'; toggle.setAttribute('aria-pressed', 'false'); } else { base = readTime(); started = performance.now(); timer = setInterval(tick, 100); toggle.textContent = 'Pause'; toggle.setAttribute('aria-pressed', 'true'); } });
        controls.forEach(e => e.addEventListener('input', () => { if (timer !== null) { base = readTime(); started = performance.now(); } draw(); }));
        function syncLocalTime() {
            const now = new Date();
            controls[0].value = now.getHours();
            controls[1].value = now.getMinutes();
            controls[2].value = now.getSeconds();
            if (timer === null) toggle.click();
            base = readTime();
            started = performance.now() - now.getMilliseconds();
            tick();
        }
        document.getElementById("sync").addEventListener("click", syncLocalTime);
        syncLocalTime();
    </script>
